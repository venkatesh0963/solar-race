<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Solar Rush</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- Three.js Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <!-- Start Screen -->
      <div id="start-screen" class="panel">
        <h1>SOLAR RUSH</h1>
        <p>A high-speed solar survival game</p>
        <div class="controls-info">
          Desktop: A / D or Left / Right Arrows<br>
          Mobile: On-screen D-Pad
        </div>
        <button id="start-btn">PLAY</button>
      </div>

      <!-- In-Game HUD (hidden by default) -->
      <div id="hud" class="hidden">
        <div class="top-bar">
          <div class="score-container">
            <div id="score-text">0</div>
          </div>
          <button id="pause-btn" class="icon-btn">
             <svg width="24" height="24" viewBox="0 0 24 24" fill="#4a3e3d"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="btn-camera" style="position: absolute; top: 20px; right: 80px; background: none; border: 2px solid white; border-radius: 5px; cursor: pointer; padding: 5px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
          </button>
          <div class="solar-meter-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 5px;">
            <div class="meter-bg" style="width: 100%; height: 100%; border: none; border-radius: 0; background: rgba(0,0,0,0.2);">
              <div id="solar-fill" class="meter-fill" style="background: #fff; height: 100%;"></div>
            </div>
          </div>
        </div>

        <!-- Mobile Controls -->
        <div id="mobile-controls" class="hidden">
          <div class="dpad-vertical">
            <button id="btn-up" class="dpad-btn">
               <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
            </button>
            <button id="btn-down" class="dpad-btn" style="margin-top: 10px;">
               <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
            </button>
          </div>
          <div class="dpad-horizontal">
            <button id="btn-left" class="dpad-btn" style="position: absolute; left: 10%; top: 50%; transform: translateY(-50%);">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
            </button>
            <button id="btn-right" class="dpad-btn" style="position: absolute; right: 10%; top: 50%; transform: translateY(-50%);">
               <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </button>
          </div>
        </div>

        <!-- Zone Announcer -->
        <div id="zone-announcer" class="hidden">
          <h2 id="zone-text">ZONE NAME</h2>
        </div>
      </div>

      <!-- Pause Screen (hidden by default) -->
      <div id="pause-screen" class="panel hidden">
        <h2>PAUSED</h2>
        <button id="resume-btn">RESUME</button>
      </div>
      
      <!-- Game Over Screen (hidden by default) -->
      <div id="game-over-screen" class="panel hidden">
        <h2>GAME OVER</h2>
        <p>You Crashed!</p>
        <p>Score: <span id="final-score">0</span></p>
        <button id="restart-btn">RETRY</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
